<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodPulse - Ecossistema Casa do Food Marketing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#f97316',
                        darkBg: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- HEADER -->
    <header class="bg-cardBg border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-500 to-amber-400 flex items-center justify-center shadow-md shadow-orange-500/20">
                <i class="fa-solid fa-chart-line text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    FoodPulse <span class="text-xs px-2 py-0.5 rounded bg-orange-500/20 text-orange-400 border border-orange-500/30">Casa do Food Marketing</span>
                </h1>
                <p class="text-xs text-slate-400">Ecossistema Completo de Gestão e Operação para Gastronomia</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1.5 rounded-full flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sistema Ativo & Sincronizado
            </span>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="flex-1 flex flex-col md:flex-row">
        
        <!-- SIDEBAR DE NAVEGAÇÃO -->
        <aside class="w-full md:w-64 bg-cardBg/50 border-r border-slate-800 p-4 flex flex-col gap-2">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider px-3 mb-1">Módulos do Sistema</p>
            
            <button onclick="switchTab('dashboard')" id="btn-dashboard" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all bg-orange-500 text-white shadow-lg shadow-orange-500/20">
                <i class="fa-solid fa-house-chimney w-5"></i> Dashboard Geral
            </button>
            <button onclick="switchTab('team')" id="btn-team" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                <i class="fa-solid fa-users-gear w-5"></i> Equipa & Acessos Google <span class="text-[10px] bg-orange-500 text-white px-1.5 py-0.5 rounded-full ml-auto">Até 10</span>
            </button>
            <button onclick="switchTab('plans')" id="btn-plans" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                <i class="fa-solid fa-crown w-5"></i> Planos & Pagamentos
            </button>
            <button onclick="switchTab('cmv')" id="btn-cmv" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                <i class="fa-solid fa-calculator w-5"></i> Calculadora CMV
            </button>
            <button onclick="switchTab('nfe')" id="btn-nfe" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                <i class="fa-solid fa-file-invoice-dollar w-5"></i> Notas Fiscais & Google Drive
            </button>
            <button onclick="switchTab('kanban')" id="btn-kanban" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                <i class="fa-solid fa-clipboard-list w-5"></i> Kanban de Conteúdos
            </button>
            <button onclick="switchTab('ponto')" id="btn-ponto" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                <i class="fa-solid fa-fingerprint w-5"></i> Ponto Digital & Assiduidade
            </button>
            <button onclick="switchTab('cardapio')" id="btn-cardapio" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                <i class="fa-solid fa-utensils w-5"></i> Cardápio Web & Vendas
            </button>
            <button onclick="switchTab('ads')" id="btn-ads" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                <i class="fa-solid fa-bullhorn w-5"></i> Tráfego Ads & WhatsApp
            </button>
        </aside>

        <!-- CONTEÚDO DINÂMICO -->
        <main class="flex-1 p-6 overflow-y-auto">

            <!-- TAB: DASHBOARD -->
            <div id="tab-dashboard" class="tab-content active space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="bg-cardBg p-5 rounded-2xl border border-slate-800">
                        <p class="text-xs text-slate-400 font-medium">Investimento Mídia (
